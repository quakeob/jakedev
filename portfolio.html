<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>portfolio - jake davis</title>
    <style>
        :root {
            --bg-primary: #050505;
            --bg-secondary: #0a0a0a;
            --border-color: #333;
            --text-primary: #e0e0e0;
            --text-secondary: #888;
            --text-tertiary: #555;
            --overlay-bg: rgba(0, 0, 0, 0.95);
            --scanline-color: rgba(0, 0, 0, 0.5);
            --glow-color: rgba(255, 255, 255, 0.15);
        }

        body.light-mode {
            --bg-primary: #f0f0f0;
            --bg-secondary: #e5e5e5;
            --border-color: #ccc;
            --text-primary: #111;
            --text-secondary: #555;
            --text-tertiary: #888;
            --overlay-bg: rgba(255, 255, 255, 0.95);
            --scanline-color: rgba(255, 255, 255, 0.5);
            --glow-color: rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 40px;
            transition: background-color 0.3s ease, color 0.3s ease;
            min-height: 100vh;
            text-shadow: 0 0 2px var(--glow-color);
        }

        /* CRT Effects */
        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% {
                opacity: 0.97;
            }

            50% {
                opacity: 0.99;
            }

            100% {
                opacity: 0.94;
            }
        }

        .header {
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-link {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            transition: all 0.2s;
        }

        .back-link:hover {
            color: var(--text-secondary);
            text-decoration: underline;
        }

        h1 {
            font-size: 24px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        .theme-toggle {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 16px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            background: var(--bg-secondary);
            border-color: var(--text-primary);
        }

        /* Masonry Layout */
        .gallery {
            column-count: 3;
            column-gap: 30px;
        }

        .gallery-item {
            break-inside: avoid;
            margin-bottom: 30px;
            position: relative;
            transition: transform 0.2s ease;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .gallery-item:hover {
            transform: scale(1.01);
            border-color: var(--text-secondary);
            z-index: 10;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            filter: grayscale(100%);
            transition: filter 0.3s ease;
        }

        .gallery-item:hover img {
            filter: grayscale(0%);
        }

        /* Lightbox */
        .fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--overlay-bg);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .fullscreen-overlay.active {
            display: flex;
        }

        .fullscreen-overlay img {
            max-width: 90%;
            max-height: 80vh;
            object-fit: contain;
            border: 1px solid var(--border-color);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .image-info {
            margin-top: 20px;
            text-align: center;
            color: var(--text-primary);
            font-size: 14px;
            max-width: 600px;
        }

        .metadata {
            margin-top: 10px;
            color: var(--text-secondary);
            font-size: 12px;
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .close-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: var(--bg-secondary);
        }

        /* Mobile responsive */
        @media (max-width: 1024px) {
            .gallery {
                column-count: 2;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 20px;
            }

            .gallery {
                column-count: 1;
            }

            .gallery-item img {
                filter: grayscale(0%);
                /* Always color on mobile */
            }

            .theme-toggle {
                padding: 6px 12px;
                font-size: 10px;
            }
        }
    </style>
</head>

            <div class="metadata">
                <span id="metaISO">ISO 400</span>

            </div>
        </div>

    <script>
        // Theme toggle functionality
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        }

        // Load saved theme
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
        }

        // Lightbox functionality
        const overlay = document.getElementById('fullscreenOverlay');
        const fullscreenImg = document.getElementById('fullscreenImage');
        const galleryItems = document.querySelectorAll('.gallery-item');
        const imageTitle = document.getElementById('imageTitle');
        const metaISO = document.getElementById('metaISO');
        const metaShutter = document.getElementById('metaShutter');
        const metaAperture = document.getElementById('metaAperture');

        galleryItems.forEach(item => {
            item.addEventListener('click', () => {
                const img = item.querySelector('img');
                fullscreenImg.src = img.src;

                // Set metadata (simulated for now, or read from data attributes)
                const pathParts = img.src.split('/');
                const filename = pathParts[pathParts.length - 1];
                imageTitle.innerText = filename;

                // Randomize metadata if not set (just for effect if data attrs missing)
                metaISO.innerText = "ISO " + (item.dataset.iso || "400");
                metaShutter.innerText = (item.dataset.shutter || "1/125") + "s";
                metaAperture.innerText = item.dataset.aperture || "f/2.8";

                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            });
        });

        function closeLightbox() {
            overlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Close on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeLightbox();
            }
        });

        // Close on background click
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
                closeLightbox();
            }
        });
    </script>
