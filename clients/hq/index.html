<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HQ — Design Review · Jake Davis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<script>
(function(){var s=localStorage.getItem('theme');if(s==='dark'||(!s&&window.matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark');})();
</script>
<style>
:root{--bg:#fff;--text:#1a1a1a;--text-2:#666;--grey:#999;--green:#2d6a4f;--border:rgba(0,0,0,.08);--mono:'Space Mono','SF Mono',monospace;--serif:'Playfair Display',Georgia,serif;}
:root.dark{--bg:#0a0a0a;--text:#e5e5e5;--text-2:#999;--grey:#555;--green:#5a9a7a;--border:rgba(255,255,255,.08);}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-font-smoothing:antialiased;}
body{font-family:var(--mono);font-size:12px;background:var(--bg);color:var(--text);text-transform:uppercase;letter-spacing:.04em;transition:background .2s,color .2s;}
::selection{background:var(--text);color:var(--bg);}
a{color:inherit;text-decoration:none;}

/* header */
.hdr{display:flex;justify-content:space-between;align-items:center;
     padding:18px 24px;border-bottom:1px solid var(--border);
     position:sticky;top:0;background:var(--bg);z-index:10;}
.hdr a{font-size:12px;color:var(--grey);}
.hdr a:hover{color:var(--text);}
.hdr__title{font-family:var(--serif);font-size:15px;text-transform:none;letter-spacing:0;font-style:italic;}
.hdr__right{display:flex;gap:1.5rem;align-items:center;}
.theme-btn{background:none;border:none;font-family:var(--mono);font-size:12px;
           text-transform:uppercase;letter-spacing:.04em;color:var(--grey);cursor:pointer;}
.theme-btn:hover{color:var(--text);}

/* featured */
.featured{padding:32px 24px;}
.featured__label{font-size:10px;color:var(--grey);margin-bottom:20px;
                  display:flex;justify-content:space-between;align-items:center;}
.featured__label a{color:var(--green);font-style:italic;}
.featured__label a:hover{text-decoration:underline;}
.featured__preview{position:relative;width:100%;height:0;padding-bottom:56.25%;
                    background:#111;overflow:hidden;border:1px solid var(--border);}
.featured__preview iframe{position:absolute;inset:0;width:200%;height:200%;
                            transform:scale(.5);transform-origin:0 0;
                            border:none;pointer-events:none;}
.featured__preview::after{content:'';position:absolute;inset:0;}
.featured__meta{margin-top:16px;display:flex;justify-content:space-between;
                align-items:baseline;border-top:1px solid var(--border);padding-top:14px;}
.featured__name{font-family:var(--serif);font-size:18px;text-transform:none;
                letter-spacing:0;font-weight:400;}
.featured__num{font-size:10px;color:var(--grey);}
.featured__open{display:inline-block;margin-top:12px;padding:11px 20px;
                font-size:10px;color:var(--green);font-style:italic;
                border:1px solid var(--border);transition:background .15s;}
.featured__open:hover{background:var(--border);}

/* footer */
.ftr{padding:16px 24px;border-top:1px solid var(--border);
     display:flex;justify-content:space-between;font-size:10px;color:var(--grey);}
</style>
</head>
<body>

<header class="hdr">
  <a href="https://jakedev.org">Jake Davis</a>
  <span class="hdr__title">HQ — Design Review</span>
  <div class="hdr__right">
    <a href="archive.html">Archive (01–15)</a>
    <a href="https://jakedev.org/#work">Work</a>
    <button class="theme-btn" id="tbtn" onclick="toggleTheme()">Dark</button>
  </div>
</header>

<div class="featured">
  <div class="featured__label">
    <span>Current direction</span>
    <a href="archive.html">View all past explorations →</a>
  </div>

  <div class="featured__preview">
    <iframe src="options/16-southworth.html" loading="lazy" title="Southworth"></iframe>
  </div>

  <div class="featured__meta">
    <span class="featured__name">Southworth</span>
    <span class="featured__num">16</span>
  </div>
  <a class="featured__open" href="options/16-southworth.html" target="_blank">Open full design →</a>
  <a class="featured__open" href="16-southworth-v2.html" target="_blank" style="display:block;margin-top:8px">Open v2 →</a>
</div>

<footer class="ftr">
  <span>Jake Davis — HQ Design Review</span>
  <span>Confidential · For client review only</span>
</footer>

<script>
function updateBtn(){document.getElementById('tbtn').textContent=document.documentElement.classList.contains('dark')?'Light':'Dark';}
updateBtn();
window.toggleTheme=function(){document.documentElement.classList.toggle('dark');localStorage.setItem('theme',document.documentElement.classList.contains('dark')?'dark':'light');updateBtn();};
</script>
</body>
</html>
